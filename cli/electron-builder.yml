appId: com.tran.agent
productName: Tran
directories:
  buildResources: build
  output: release
icon: build/icon.ico
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/desktopShortcutIcon.ico
    to: desktopShortcutIcon.ico
  - from: build/icon.ico
    to: icon.ico
  - from: extension
    to: browser-extension
  # MCP server 必须在 asar 外：ELECTRON_RUN_AS_NODE 模式读不了 asar 里的文件。
  # 放 out/mcp/ 而不是 out/main/ 是因为 electron-vite dev 会清空 out/main。
  - from: out/mcp/mcp-browser.js
    to: mcp-browser.js
  - from: out/mcp/mcp-desktop.js
    to: mcp-desktop.js
  # 内置小工具：源码随包，运行环境由 uv 在首跑时自动解析（不打 .venv）。
  # screen-assist 的个人配置/会话/日志不打进安装包。
  - from: ../tools/xhh
    to: tools/xhh
    filter:
      - '**/*'
      - '!.venv'
      - '!**/__pycache__'
      - '!test_*.py'
  - from: ../tools/xtw
    to: tools/xtw
    filter:
      - '**/*'
      - '!.venv'
      - '!**/__pycache__'
      - '!test_*.py'
  - from: ../tools/screen-assist
    to: tools/screen-assist
    filter:
      - '**/*'
      - '!.venv'
      - '!**/__pycache__'
      - '!config.toml'
      - '!sessions.json'
      - '!gui.log'
      - '!kb_test'
asar: true
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  include: build/installer.nsh
  installerIcon: build/installerIcon.ico
  installerHeaderIcon: build/installerHeaderIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

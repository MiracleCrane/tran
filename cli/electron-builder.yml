appId: com.tran.agent
productName: Tran
directories:
  buildResources: build
  output: release
icon: build/icon.ico
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/desktopShortcutIcon.ico
    to: desktopShortcutIcon.ico
  - from: build/icon.ico
    to: icon.ico
  - from: extension
    to: browser-extension
  # MCP server 必须在 asar 外：ELECTRON_RUN_AS_NODE 模式读不了 asar 里的文件。
  # 放 out/mcp/ 而不是 out/main/ 是因为 electron-vite dev 会清空 out/main。
  - from: out/mcp/mcp-browser.js
    to: mcp-browser.js
  - from: out/mcp/mcp-desktop.js
    to: mcp-desktop.js
asar: true
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  include: build/installer.nsh
  installerIcon: build/installerIcon.ico
  installerHeaderIcon: build/installerHeaderIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

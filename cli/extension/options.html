<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Tran 浏览器桥 - 配对</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 18px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; font-family: monospace; border: 1px solid #d1d5db; border-radius: 6px; }
    button { margin-top: 10px; padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 16px; padding: 10px 12px; border-radius: 6px; background: #f3f4f6; font-size: 13px; white-space: pre-line; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    p.hint { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Tran 浏览器桥 - 配对</h1>
  <p class="hint">在 Tran 的「设置 → MCP → 浏览器控制」里复制配对码，粘贴到下面。</p>
  <input id="code" placeholder="tran1:9224:xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false" />
  <button id="save">保存并连接</button>
  <div id="status">加载中…</div>
  <script src="options.js"></script>
</body>
</html>
